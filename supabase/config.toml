# Supabase CLI config (local dev: `supabase start`). On the hosted project set the same values in the dashboard:
# Auth → Providers → Email: enabled, "Confirm email" OFF; Auth → Settings: "Allow new users to sign up" OFF;
# password minimum length 6.
project_id = "dorm-finance"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = []
# Nobody can self-register with the anon key; accounts are created only by the admin-create-user function.
enable_signup = false
minimum_password_length = 6
# "remember device 30 days": refresh tokens keep the session; JWT itself is short-lived
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = false
enable_confirmations = false

[storage]
file_size_limit = "5MiB"

[functions.login]
verify_jwt = false

[functions.activate]
verify_jwt = false

[functions.admin-create-user]
verify_jwt = true
